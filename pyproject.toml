[project]
name = "finana-ai-advisor"
version = "1.0.0"
description = "AI Financial Advisor with Streamlit UI, FastAPI gateway, and deterministic finance calculators."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.0",
    "uvicorn==0.54.0",
    "pydantic==2.13.1",
    "groq==0.37.1",
    "python-dotenv==1.2.2",
    "streamlit==1.57.0",
    "httpx==0.28.1",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "flake8>=7.1.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
